<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODERN JANKENMAN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <div class="medal-display">
                <span>TOTAL MEDALS: </span>
                <span id="total-medals">0</span>
            </div>
        </header>

        <main id="main-display">
            <div id="status-text">PRESS START</div>

            <div id="visual-area">
                <div id="cpu-hand" class="hand-icon">?</div>
                <div id="player-hand" class="hand-icon">?</div>
            </div>

            <div id="control-panel">
                <button id="start-btn" class="neon-btn">スタート</button>
                <div id="janken-btns" class="hidden">
                    <button class="janken-btn" data-hand="rock">✊</button>
                    <button class="janken-btn" data-hand="scissors">✌️</button>
                    <button class="janken-btn" data-hand="paper">🖐️</button>
                </div>
                <div id="double-up-btns" class="hidden">
                    <button id="yes-btn" class="neon-btn btn-yes">YES (DOUBLE!)</button>
                    <button id="no-btn" class="neon-btn btn-no">NO (STOP)</button>
                </div>
            </div>
        </main>

        <footer>
            <div id="history">HISTORY: </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
